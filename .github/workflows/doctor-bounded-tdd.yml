name: Doctor Bounded TDD

on:
  push:
    branches:
      - fix/doctor-bounded-progress

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tui/go.sum
      - name: Doctor bounded progress regression
        working-directory: tui
        run: |
          go test ./internal/doctor -run 'TestDoctorSSECheckCannotHangPastBehaviorTimeout|TestInferenceCleanupCannotHangOnCancel|TestServicePublishesProgressBeforeRunningCheck' -count=1
          go test ./cmd/codea -run TestRunDoctorServicePrintsProgressBeforeCompletion -count=1
