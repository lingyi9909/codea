name: Doctor Bounded Verify

on:
  push:
    branches:
      - fix/doctor-bounded-progress

permissions:
  contents: read

jobs:
  linux-full:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tui/go.sum
      - name: Full Go verification
        working-directory: tui
        run: |
          go test ./... -count=1
          go test -race ./internal/doctor ./cmd/codea -count=1
          go vet ./...
          go build ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...

  windows-doctor:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tui/go.sum
      - name: Native Windows Doctor verification
        working-directory: tui
        shell: pwsh
        run: |
          go test ./internal/doctor -count=1
          go test ./cmd/codea -count=1
          go build ./cmd/codea
