name: Agent Timeout TDD

on:
  push:
    branches:
      - fix/windows-agent-cold-start-timeout

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tui/go.sum
      - name: Agent cold-start timeout regression
        working-directory: tui
        run: GOTOOLCHAIN=local go test ./internal/opencode -run TestListAgentsUsesDedicatedColdStartTimeout -count=1
