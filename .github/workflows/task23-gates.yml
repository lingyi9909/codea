name: Task 23 Runtime Workspace Gates

on:
  workflow_dispatch:
  push:
    branches: [task23-runtime-workspace, develop]
    paths:
      - 'tui/internal/runtime/**'
      - 'tui/internal/opencode/**'
      - 'tui/internal/app/**'
      - 'tui/internal/command/**'
      - 'tui/cmd/codea/**'
      - 'tui/tests/fixtures/fake-runtime/**'
      - 'tui/tests/architecture/**'
      - 'scripts/check-execution-state.sh'
      - 'docs/execution-state.yaml'
      - 'docs/superpowers/plans/2026-08-27-codea-v1.1-task23-runtime-workspace-plan.md'
      - '.github/workflows/task23-gates.yml'

concurrency:
  group: task23-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tui/go.sum
      - name: Validate execution state
        run: bash scripts/check-execution-state.sh
      - name: Task 23 focused tests
        working-directory: tui
        run: |
          GOTOOLCHAIN=local go test ./internal/runtime ./internal/opencode ./internal/command ./internal/app -run 'Task23|RuntimeWorkspace|Model|Compact|Doctor|Status' -count=1
      - name: Architecture boundary
        working-directory: tui
        run: GOTOOLCHAIN=local go test ./tests/architecture -count=1
      - name: Full Go regression
        working-directory: tui
        run: GOTOOLCHAIN=local go test ./... -count=1
      - name: Vet and build
        working-directory: tui
        run: |
          GOTOOLCHAIN=local go vet ./...
          GOTOOLCHAIN=local go build ./...
      - name: Windows x64 cross-build
        working-directory: tui
        run: GOOS=windows GOARCH=amd64 GOTOOLCHAIN=local go build ./...

  windows-runtime-workspace:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tui/go.sum
      - name: Task 23 focused tests on Windows
        working-directory: tui
        shell: pwsh
        run: |
          $env:GOTOOLCHAIN='local'
          go test ./internal/runtime ./internal/opencode ./internal/command ./internal/app -run 'Task23|RuntimeWorkspace|Model|Compact|Doctor|Status' -count=1
