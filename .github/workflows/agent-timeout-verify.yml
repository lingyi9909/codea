name: Agent Timeout Verify

on:
  push:
    branches:
      - fix/windows-agent-cold-start-timeout
    paths:
      - '.github/workflows/agent-timeout-verify.yml'
      - 'tui/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tui/go.sum
      - name: Full Go regression
        working-directory: tui
        run: |
          GOTOOLCHAIN=local go test ./... -count=1
          GOTOOLCHAIN=local go test -race ./internal/opencode -count=1
          GOTOOLCHAIN=local go vet ./...
          GOTOOLCHAIN=local go build ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 GOTOOLCHAIN=local go build ./...
