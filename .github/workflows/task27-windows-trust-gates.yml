name: Task 27 Windows Trust Chain Gates

on:
  push:
    branches: [task27-windows-trust-chain, develop]
    paths:
      - 'tui/**'
      - 'distribution/**'
      - 'runtime/**'
      - 'packaging/**'
      - 'tests/task27_windows_trust_contract_test.py'
      - 'tests/release/**'
      - 'docs/execution-state.yaml'
      - 'docs/task-reports/task-27.md'
      - 'docs/release/**'
      - '.github/workflows/task27-windows-trust-gates.yml'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task27-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract dependency
        run: pip install PyYAML==6.0.2
      - name: Task 27 trust contract
        run: python tests/task27_windows_trust_contract_test.py
      - name: Task 27 Authenticode contract
        run: python tests/release/task27_authenticode_contract_test.py
      - name: Task 27 security evidence contract
        run: python tests/release/task27_security_evidence_contract_test.py

  build-formal-windows-package:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tui/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install enterprise plugin dependencies
        working-directory: distribution/plugins
        run: bun install --frozen-lockfile
      - name: Build formal Windows x64 release zip
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-task27
          mkdir -p dist-task27
          bash packaging/scripts/build-release.sh windows-x64 dist-task27
          ls -lh dist-task27/codea-*-windows-x64.zip dist-task27/codea-*-windows-x64.zip.sha256

      - name: Generate ephemeral Authenticode proof identity on Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          cat > "$work/root.cnf" <<'EOF'
          [req]
          distinguished_name = dn
          x509_extensions = ext
          prompt = no

          [dn]
          CN = Codea Task27 CI Root

          [ext]
          basicConstraints = critical,CA:TRUE,pathlen:0
          keyUsage = critical,keyCertSign,cRLSign
          subjectKeyIdentifier = hash
          authorityKeyIdentifier = keyid:always,issuer
          EOF

          cat > "$work/leaf-request.cnf" <<'EOF'
          [req]
          distinguished_name = dn
          prompt = no

          [dn]
          CN = Codea Task27 CI Ephemeral
          EOF

          cat > "$work/leaf-ext.cnf" <<'EOF'
          [ext]
          basicConstraints = critical,CA:FALSE
          keyUsage = critical,digitalSignature
          extendedKeyUsage = codeSigning
          subjectKeyIdentifier = hash
          authorityKeyIdentifier = keyid,issuer
          EOF

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$work/root.key" \
            -out "$work/root.pem" \
            -days 1 -sha256 -config "$work/root.cnf"

          openssl req -new -newkey rsa:2048 -nodes \
            -keyout "$work/leaf.key" \
            -out "$work/leaf.csr" \
            -config "$work/leaf-request.cnf"

          openssl x509 -req \
            -in "$work/leaf.csr" \
            -CA "$work/root.pem" \
            -CAkey "$work/root.key" \
            -CAcreateserial \
            -out "$work/leaf.pem" \
            -days 1 -sha256 \
            -extfile "$work/leaf-ext.cnf" \
            -extensions ext

          openssl pkcs12 -export \
            -out dist-task27/task27-signing-proof.pfx \
            -inkey "$work/leaf.key" \
            -in "$work/leaf.pem" \
            -certfile "$work/root.pem" \
            -passout pass:task27-ci-ephemeral
          openssl x509 -in "$work/leaf.pem" -outform der \
            -out dist-task27/task27-signing-proof.cer
          openssl x509 -in "$work/root.pem" -outform der \
            -out dist-task27/task27-signing-root.cer
          openssl verify -CAfile "$work/root.pem" "$work/leaf.pem"
          openssl x509 -in "$work/leaf.pem" -noout -subject -issuer -fingerprint -sha256
          openssl x509 -in "$work/root.pem" -noout -subject -fingerprint -sha256
          test -s dist-task27/task27-signing-proof.pfx
          test -s dist-task27/task27-signing-proof.cer
          test -s dist-task27/task27-signing-root.cer

      - name: Upload formal Windows release zip
        uses: actions/upload-artifact@v4
        with:
          name: task27-formal-windows-release-${{ github.sha }}
          path: |
            dist-task27/codea-*-windows-x64.zip
            dist-task27/codea-*-windows-x64.zip.sha256
            dist-task27/task27-signing-proof.pfx
            dist-task27/task27-signing-proof.cer
            dist-task27/task27-signing-root.cer
          if-no-files-found: error

  windows-trust-regression:
    needs: build-formal-windows-package
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tui/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: task27-formal-windows-release-${{ github.sha }}
          path: task27-artifact

      - name: Full native Windows Go regression
        working-directory: tui
        shell: pwsh
        run: go test ./... -count=1

      - name: Windows bounded access-denied and process-tree regression
        working-directory: tui
        shell: pwsh
        run: go test ./internal/supervisor -run 'TestJobObjectUsesMinimalProcessRights|TestStartRuntimeCommandRetriesTransientAccessDenied|TestStartRuntimeCommandDoesNotRetryOtherErrors|TestStopTerminatesProcessTree|TestStopForceKillFallback' -count=1 -v

      - name: Prepare ephemeral Authenticode proof material
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Get-ChildItem -LiteralPath task27-artifact -Filter 'codea-*-windows-x64.zip' -File | Select-Object -First 1
          if (-not $archive) { throw 'formal Windows release zip missing' }
          $pfx = (Resolve-Path -LiteralPath 'task27-artifact/task27-signing-proof.pfx').Path
          $cer = (Resolve-Path -LiteralPath 'task27-artifact/task27-signing-proof.cer').Path
          $rootCer = (Resolve-Path -LiteralPath 'task27-artifact/task27-signing-root.cer').Path

          $proofExe = Join-Path $env:RUNNER_TEMP 'codea-task27-signing-proof.exe'
          Remove-Item -LiteralPath $proofExe -Force -ErrorAction SilentlyContinue
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($archive.FullName)
          try {
            $entry = $zip.Entries | Where-Object { $_.FullName -match '(^|/)bin/codea\.exe$' } | Select-Object -First 1
            if (-not $entry) { throw 'codea.exe missing from formal release zip' }
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $proofExe, $true)
          } finally {
            $zip.Dispose()
          }
          Write-Host 'Extracted formal release codea.exe for signing proof.'

          $leafCert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($cer)
          $rootCert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($rootCer)
          try {
            $thumbprint = $leafCert.Thumbprint
            $rootThumbprint = $rootCert.Thumbprint

            "TASK27_PROOF_EXE=$proofExe" >> $env:GITHUB_ENV
            "TASK27_PROOF_PFX=$pfx" >> $env:GITHUB_ENV
            "TASK27_PROOF_CER=$cer" >> $env:GITHUB_ENV
            "TASK27_PROOF_ROOT_CER=$rootCer" >> $env:GITHUB_ENV
            "TASK27_PROOF_PASSWORD=task27-ci-ephemeral" >> $env:GITHUB_ENV
            "TASK27_PROOF_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV
            "TASK27_PROOF_ROOT_THUMBPRINT=$rootThumbprint" >> $env:GITHUB_ENV

            $rootStore = [Security.Cryptography.X509Certificates.X509Store]::new(
              'Root',
              [Security.Cryptography.X509Certificates.StoreLocation]::LocalMachine
            )
            try {
              $rootStore.Open([Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
              $rootStore.Add($rootCert)
            } finally {
              $rootStore.Close()
            }

            $publisherStore = [Security.Cryptography.X509Certificates.X509Store]::new(
              'TrustedPublisher',
              [Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser
            )
            try {
              $publisherStore.Open([Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
              $publisherStore.Add($leafCert)
            } finally {
              $publisherStore.Close()
            }
          } finally {
            $leafCert.Dispose()
            $rootCert.Dispose()
          }

          Write-Host "Prepared trusted Authenticode chain root=$rootThumbprint leaf=$thumbprint"

      - name: Sign Authenticode proof executable
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          & ./packaging/platform/windows/sign-release.ps1 -File $env:TASK27_PROOF_EXE -PfxPath $env:TASK27_PROOF_PFX -PfxPassword $env:TASK27_PROOF_PASSWORD

      - name: Verify Authenticode proof signature
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          & ./packaging/platform/windows/verify-signature.ps1 -File $env:TASK27_PROOF_EXE -ExpectedThumbprint $env:TASK27_PROOF_THUMBPRINT -ExpectedSubject 'Codea Task27 CI Ephemeral'

      - name: Stable without signing credentials fails closed
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Get-ChildItem -LiteralPath task27-artifact -Filter 'codea-*-windows-x64.zip' -File | Select-Object -First 1
          if (-not $archive) { throw 'formal Windows release zip missing' }
          $negativeArchive = Join-Path $env:RUNNER_TEMP 'task27-negative-stable.zip'
          $negativeEvidence = Join-Path $env:RUNNER_TEMP 'task27-negative-stable-evidence.json'
          Remove-Item -LiteralPath $negativeArchive,$negativeEvidence,($negativeArchive + '.sha256') -Force -ErrorAction SilentlyContinue
          Copy-Item -LiteralPath $archive.FullName -Destination $negativeArchive
          $beforeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $negativeArchive).Hash
          Remove-Item Env:CODEA_WINDOWS_SIGNING_PFX_BASE64 -ErrorAction SilentlyContinue
          Remove-Item Env:CODEA_WINDOWS_SIGNING_PFX_PASSWORD -ErrorAction SilentlyContinue
          $failedClosed = $false
          try {
            & ./packaging/platform/windows/finalize-release.ps1 -Archive $negativeArchive -Channel stable -GitCommit '${{ github.sha }}' -ReleaseTag 'task27-ci-negative' -EvidenceOutput $negativeEvidence
          } catch {
            if ($_.Exception.Message -notmatch 'stable Windows release requires') { throw }
            $failedClosed = $true
            Write-Host "Expected stable credential failure: $($_.Exception.Message)"
          }
          if (-not $failedClosed) { throw 'expected stable finalizer to fail without signing credentials' }
          if (Test-Path -LiteralPath $negativeEvidence) { throw 'stable fail-closed path unexpectedly generated security evidence' }
          if (Test-Path -LiteralPath ($negativeArchive + '.sha256')) { throw 'stable fail-closed path unexpectedly generated finalized SHA256 sidecar' }
          $afterHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $negativeArchive).Hash
          if ($afterHash -ne $beforeHash) { throw 'stable fail-closed path mutated unsigned archive' }
          Write-Host 'TASK27_STABLE_WITHOUT_CREDENTIALS_FAIL_CLOSED PASS'

      - name: Stable Finalized Release E2E
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Get-ChildItem -LiteralPath task27-artifact -Filter 'codea-*-windows-x64.zip' -File | Select-Object -First 1
          if (-not $archive) { throw 'formal Windows release zip missing' }
          $evidence = Join-Path $PWD 'task27-artifact/task27-stable-security-evidence.json'
          $env:CODEA_WINDOWS_SIGNING_PFX_BASE64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($env:TASK27_PROOF_PFX))
          $env:CODEA_WINDOWS_SIGNING_PFX_PASSWORD = $env:TASK27_PROOF_PASSWORD
          Remove-Item Env:CODEA_WINDOWS_TIMESTAMP_URL -ErrorAction SilentlyContinue
          try {
            & ./packaging/platform/windows/finalize-release.ps1 -Archive $archive.FullName -Channel stable -GitCommit '${{ github.sha }}' -ReleaseTag 'task27-ci' -EvidenceOutput $evidence
            & ./tests/release/task27-stable-finalized-release-e2e.ps1 -Archive $archive.FullName -Evidence $evidence -ExpectedThumbprint $env:TASK27_PROOF_THUMBPRINT
          } finally {
            Remove-Item Env:CODEA_WINDOWS_SIGNING_PFX_BASE64 -ErrorAction SilentlyContinue
            Remove-Item Env:CODEA_WINDOWS_SIGNING_PFX_PASSWORD -ErrorAction SilentlyContinue
          }
          "TASK27_STABLE_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          Write-Host 'TASK27_STABLE_FINALIZED_RELEASE_E2E PASS'

      - name: Cleanup ephemeral Authenticode proof material
        if: always()
        shell: pwsh
        run: |
          $leafThumb = [string]$env:TASK27_PROOF_THUMBPRINT
          if (-not [string]::IsNullOrWhiteSpace($leafThumb)) {
            $publisherStore = [Security.Cryptography.X509Certificates.X509Store]::new(
              'TrustedPublisher',
              [Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser
            )
            try {
              $publisherStore.Open([Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
              $matches = $publisherStore.Certificates.Find(
                [Security.Cryptography.X509Certificates.X509FindType]::FindByThumbprint,
                $leafThumb,
                $false
              )
              foreach ($match in $matches) {
                $publisherStore.Remove($match)
                $match.Dispose()
              }
            } finally {
              $publisherStore.Close()
            }
          }

          $rootThumb = [string]$env:TASK27_PROOF_ROOT_THUMBPRINT
          if (-not [string]::IsNullOrWhiteSpace($rootThumb)) {
            $rootStore = [Security.Cryptography.X509Certificates.X509Store]::new(
              'Root',
              [Security.Cryptography.X509Certificates.StoreLocation]::LocalMachine
            )
            try {
              $rootStore.Open([Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
              $matches = $rootStore.Certificates.Find(
                [Security.Cryptography.X509Certificates.X509FindType]::FindByThumbprint,
                $rootThumb,
                $false
              )
              foreach ($match in $matches) {
                $rootStore.Remove($match)
                $match.Dispose()
              }
            } finally {
              $rootStore.Close()
            }
          }

          $paths = @([string]$env:TASK27_PROOF_EXE) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if ($paths.Count -gt 0) {
            Remove-Item -LiteralPath $paths -Force -ErrorAction SilentlyContinue
          }

      - name: Verify finalized 360 and EDR evidence
        shell: pwsh
        run: |
          $archive = Get-ChildItem -LiteralPath task27-artifact -Filter 'codea-*-windows-x64.zip' -File | Select-Object -First 1
          if (-not $archive) { throw 'finalized Windows release zip missing' }
          if (-not (Test-Path -LiteralPath $env:TASK27_STABLE_EVIDENCE -PathType Leaf)) { throw 'stable finalizer security evidence missing' }
          $json = Get-Content -LiteralPath $env:TASK27_STABLE_EVIDENCE -Raw | ConvertFrom-Json
          if ($json.releaseSha256 -ne (Get-FileHash -Algorithm SHA256 -LiteralPath $archive.FullName).Hash.ToLowerInvariant()) { throw 'security evidence release SHA256 mismatch' }
          if ($json.openCodeVersion -ne '1.18.11') { throw 'security evidence OpenCode version mismatch' }
          if ($json.signatureStatus -ne 'Valid') { throw "security evidence signature status is $($json.signatureStatus), expected Valid" }
          if ([string]::IsNullOrWhiteSpace([string]$json.signerSubject)) { throw 'security evidence signer subject missing' }
          if ([string]::IsNullOrWhiteSpace([string]$json.signerThumbprint)) { throw 'security evidence signer thumbprint missing' }
          Get-Content -LiteralPath $env:TASK27_STABLE_EVIDENCE

      - name: Windows installed-package real lifecycle smoke - fresh install MOTW upgrade rollback
        shell: pwsh
        timeout-minutes: 12
        run: |
          $archive = Get-ChildItem -LiteralPath task27-artifact -Filter 'codea-*-windows-x64.zip' -File | Select-Object -First 1
          if (-not $archive) { throw 'formal Windows release zip missing' }
          & ./tests/release/task27-windows-installed-lifecycle.ps1 -Archive $archive.FullName

      - name: Confirm Task 26 Windows native regression remains green
        working-directory: tui
        shell: pwsh
        run: |
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
