name: Task 27 Windows Trust Chain Gates

on:
  push:
    branches: [task27-windows-trust-chain, develop]
    paths:
      - 'tui/**'
      - 'distribution/**'
      - 'runtime/**'
      - 'packaging/**'
      - 'tests/task27_windows_trust_contract_test.py'
      - 'tests/release/**'
      - 'docs/execution-state.yaml'
      - 'docs/task-reports/task-27.md'
      - 'docs/release/**'
      - '.github/workflows/task27-windows-trust-gates.yml'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task27-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract dependency
        run: pip install PyYAML==6.0.2
      - name: Task 27 trust contract
        run: python tests/task27_windows_trust_contract_test.py
      - name: Task 27 Authenticode contract
        run: python tests/release/task27_authenticode_contract_test.py
      - name: Task 27 security evidence contract
        run: python tests/release/task27_security_evidence_contract_test.py

  build-formal-windows-package:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tui/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install enterprise plugin dependencies
        working-directory: distribution/plugins
        run: bun install --frozen-lockfile
      - name: Build formal Windows x64 release zip
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-task27
          mkdir -p dist-task27
          bash packaging/scripts/build-release.sh windows-x64 dist-task27
          ls -lh dist-task27/codea-*-windows-x64.zip dist-task27/codea-*-windows-x64.zip.sha256
      - name: Upload formal Windows release zip
        uses: actions/upload-artifact@v4
        with:
          name: task27-formal-windows-release-${{ github.sha }}
          path: |
            dist-task27/codea-*-windows-x64.zip
            dist-task27/codea-*-windows-x64.zip.sha256
          if-no-files-found: error

  windows-trust-regression:
    needs: build-formal-windows-package
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tui/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: task27-formal-windows-release-${{ github.sha }}
          path: task27-artifact

      - name: Full native Windows Go regression
        working-directory: tui
        shell: pwsh
        run: go test ./... -count=1

      - name: Windows bounded access-denied and process-tree regression
        working-directory: tui
        shell: pwsh
        run: go test ./internal/supervisor -run 'TestJobObjectUsesMinimalProcessRights|TestStartRuntimeCommandRetriesTransientAccessDenied|TestStartRuntimeCommandDoesNotRetryOtherErrors|TestStopTerminatesProcessTree|TestStopForceKillFallback' -count=1 -v

      - name: Prepare ephemeral Authenticode proof material
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Get-ChildItem -LiteralPath task27-artifact -Filter 'codea-*-windows-x64.zip' -File | Select-Object -First 1
          if (-not $archive) { throw 'formal Windows release zip missing' }

          $proofExe = Join-Path $env:RUNNER_TEMP 'codea-task27-signing-proof.exe'
          Remove-Item -LiteralPath $proofExe -Force -ErrorAction SilentlyContinue
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($archive.FullName)
          try {
            $entry = $zip.Entries | Where-Object { $_.FullName -match '(^|/)bin/codea\.exe$' } | Select-Object -First 1
            if (-not $entry) { throw 'codea.exe missing from formal release zip' }
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $proofExe, $true)
          } finally {
            $zip.Dispose()
          }
          Write-Host 'Extracted formal release codea.exe for signing proof.'

          $opensslCommand = Get-Command openssl.exe -ErrorAction SilentlyContinue
          $openssl = if ($opensslCommand) { $opensslCommand.Source } else { $null }
          if (-not $openssl) {
            foreach ($candidate in @(
              'C:\Program Files\Git\mingw64\bin\openssl.exe',
              'C:\Program Files\Git\usr\bin\openssl.exe'
            )) {
              if (Test-Path -LiteralPath $candidate -PathType Leaf) {
                $openssl = $candidate
                break
              }
            }
          }
          if (-not $openssl) { throw 'openssl.exe not found on Windows runner' }
          Write-Host "Using OpenSSL: $openssl"

          $passwordText = [guid]::NewGuid().ToString('N')
          $key = Join-Path $env:RUNNER_TEMP 'task27-signing-proof.key.pem'
          $pem = Join-Path $env:RUNNER_TEMP 'task27-signing-proof.cert.pem'
          $pfx = Join-Path $env:RUNNER_TEMP 'task27-signing-proof.pfx'
          $cer = Join-Path $env:RUNNER_TEMP 'task27-signing-proof.cer'
          $config = Join-Path $env:RUNNER_TEMP 'task27-signing-proof.openssl.cnf'
          Remove-Item -LiteralPath $key,$pem,$pfx,$cer,$config -Force -ErrorAction SilentlyContinue

          @"
          [req]
          distinguished_name = dn
          x509_extensions = ext
          prompt = no

          [dn]
          CN = Codea Task27 CI Ephemeral

          [ext]
          basicConstraints = critical,CA:TRUE
          keyUsage = critical,digitalSignature,keyCertSign
          extendedKeyUsage = codeSigning
          subjectKeyIdentifier = hash
          authorityKeyIdentifier = keyid:always,issuer
          "@ | Set-Content -LiteralPath $config -Encoding ascii

          try {
            & $openssl req -x509 -newkey rsa:2048 -nodes -keyout $key -out $pem -days 1 -sha256 -config $config
            if ($LASTEXITCODE -ne 0) { throw "openssl certificate generation failed with exit code $LASTEXITCODE" }

            & $openssl pkcs12 -export -out $pfx -inkey $key -in $pem -passout "pass:$passwordText"
            if ($LASTEXITCODE -ne 0) { throw "openssl PFX export failed with exit code $LASTEXITCODE" }

            & $openssl x509 -in $pem -outform der -out $cer
            if ($LASTEXITCODE -ne 0) { throw "openssl DER export failed with exit code $LASTEXITCODE" }

            $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($cer)
            try {
              $thumbprint = $cert.Thumbprint
            } finally {
              $cert.Dispose()
            }

            & certutil.exe -user -addstore -f Root $cer | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "certutil Root import failed with exit code $LASTEXITCODE" }
            & certutil.exe -user -addstore -f TrustedPublisher $cer | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "certutil TrustedPublisher import failed with exit code $LASTEXITCODE" }

            "TASK27_PROOF_EXE=$proofExe" >> $env:GITHUB_ENV
            "TASK27_PROOF_PFX=$pfx" >> $env:GITHUB_ENV
            "TASK27_PROOF_CER=$cer" >> $env:GITHUB_ENV
            "TASK27_PROOF_PASSWORD=$passwordText" >> $env:GITHUB_ENV
            "TASK27_PROOF_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV
            Write-Host "Prepared OpenSSL ephemeral Code Signing cert $thumbprint"
          } finally {
            Remove-Item -LiteralPath $key,$pem,$config -Force -ErrorAction SilentlyContinue
          }

      - name: Sign Authenticode proof executable
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          & ./packaging/platform/windows/sign-release.ps1 -File $env:TASK27_PROOF_EXE -PfxPath $env:TASK27_PROOF_PFX -PfxPassword $env:TASK27_PROOF_PASSWORD

      - name: Verify Authenticode proof signature
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          & ./packaging/platform/windows/verify-signature.ps1 -File $env:TASK27_PROOF_EXE -ExpectedThumbprint $env:TASK27_PROOF_THUMBPRINT -ExpectedSubject 'Codea Task27 CI Ephemeral'

      - name: Cleanup ephemeral Authenticode proof material
        if: always()
        shell: pwsh
        run: |
          $thumb = [string]$env:TASK27_PROOF_THUMBPRINT
          if (-not [string]::IsNullOrWhiteSpace($thumb)) {
            & certutil.exe -user -delstore Root $thumb *> $null
            & certutil.exe -user -delstore TrustedPublisher $thumb *> $null
          }
          $paths = @(
            [string]$env:TASK27_PROOF_PFX,
            [string]$env:TASK27_PROOF_CER,
            [string]$env:TASK27_PROOF_EXE,
            (Join-Path $env:RUNNER_TEMP 'task27-signing-proof.key.pem'),
            (Join-Path $env:RUNNER_TEMP 'task27-signing-proof.cert.pem'),
            (Join-Path $env:RUNNER_TEMP 'task27-signing-proof.openssl.cnf')
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if ($paths.Count -gt 0) {
            Remove-Item -LiteralPath $paths -Force -ErrorAction SilentlyContinue
          }
          exit 0

      - name: Generate deterministic 360 and EDR evidence
        shell: pwsh
        run: |
          $archive = Get-ChildItem -LiteralPath task27-artifact -Filter 'codea-*-windows-x64.zip' -File | Select-Object -First 1
          if (-not $archive) { throw 'formal Windows release zip missing' }
          $evidence = Join-Path $env:RUNNER_TEMP 'task27-security-evidence.json'
          & ./packaging/platform/windows/build-security-evidence.ps1 -Archive $archive.FullName -GitCommit '${{ github.sha }}' -ReleaseTag 'task27-ci' -Output $evidence
          $json = Get-Content -LiteralPath $evidence -Raw | ConvertFrom-Json
          if ($json.releaseSha256 -ne (Get-FileHash -Algorithm SHA256 -LiteralPath $archive.FullName).Hash.ToLowerInvariant()) { throw 'security evidence release SHA256 mismatch' }
          if ($json.openCodeVersion -ne '1.18.11') { throw 'security evidence OpenCode version mismatch' }
          Get-Content -LiteralPath $evidence

      - name: Windows installed-package real lifecycle smoke - fresh install MOTW upgrade rollback
        shell: pwsh
        timeout-minutes: 12
        run: |
          $archive = Get-ChildItem -LiteralPath task27-artifact -Filter 'codea-*-windows-x64.zip' -File | Select-Object -First 1
          if (-not $archive) { throw 'formal Windows release zip missing' }
          & ./tests/release/task27-windows-installed-lifecycle.ps1 -Archive $archive.FullName

      - name: Confirm Task 26 Windows native regression remains green
        working-directory: tui
        shell: pwsh
        run: |
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
