name: Task 28 TDD RED

on:
  push:
    branches: [task28-tdd-red]

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tui/go.sum
      - name: Task 28.6 RED
        working-directory: tui
        run: GOTOOLCHAIN=local go test ./internal/app -run 'RepoContext' -count=1
