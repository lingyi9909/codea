name: Offline Plugin TDD

on:
  push:
    branches:
      - fix/offline-plugin-dependency-bootstrap

jobs:
  red-green:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
        working-directory: tui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
      - name: Targeted offline plugin dependency tests
        run: go test ./internal/opencode -run 'Test(PrepareOfflinePluginDependencySeedsOpenCodeInstallSentinel|MergePluginConfigSeedsOfflineOpenCodeInstallSentinel)' -count=1
