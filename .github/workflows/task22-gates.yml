name: Task 22 Command Workspace Gates

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'tui/internal/command/**'
      - 'tui/internal/app/**'
      - 'tui/cmd/codea/**'
      - 'tui/tests/fixtures/fake-runtime/**'
      - 'docs/superpowers/plans/2026-08-26-codea-v1.1-task22-command-workspace-plan.md'
      - '.github/workflows/task22-gates.yml'

concurrency:
  group: task22-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tui/go.sum
      - name: Task 22 focused tests
        working-directory: tui
        run: GOTOOLCHAIN=local go test ./internal/command ./internal/app -count=1
      - name: Full Go regression
        working-directory: tui
        run: GOTOOLCHAIN=local go test ./... -count=1
      - name: Vet and build
        working-directory: tui
        run: |
          GOTOOLCHAIN=local go vet ./...
          GOTOOLCHAIN=local go build ./...
      - name: Windows x64 cross-build
        working-directory: tui
        run: GOOS=windows GOARCH=amd64 GOTOOLCHAIN=local go build ./...

  windows-command-workspace:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tui/go.sum
      - name: Task 22 focused tests on Windows
        working-directory: tui
        shell: pwsh
        run: |
          $env:GOTOOLCHAIN='local'
          go test ./internal/command ./internal/app -count=1
