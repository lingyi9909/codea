name: Offline Plugin Bootstrap TDD

on:
  push:
    branches:
      - fix/offline-plugin-bootstrap

jobs:
  windows-offline-plugin:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum

      - name: Download locked OpenCode v1.18.11 Windows runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $meta = Get-Content -LiteralPath runtime/version.json -Raw | ConvertFrom-Json
          if ($meta.openCodeVersion -ne '1.18.11') { throw "unexpected OpenCode version: $($meta.openCodeVersion)" }
          $p = $meta.platforms.'windows-x64'
          $archive = Join-Path $env:RUNNER_TEMP $p.asset
          Invoke-WebRequest -Uri $p.url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $expected = ([string]$p.checksum) -replace '^sha256:', ''
          if ($actual -ne $expected) { throw "OpenCode checksum mismatch: $actual != $expected" }
          $extract = Join-Path $env:RUNNER_TEMP 'opencode-1.18.11'
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $bin = Get-ChildItem -LiteralPath $extract -Recurse -Filter opencode.exe -File | Select-Object -First 1
          if (-not $bin) { throw 'opencode.exe not found' }
          "CODEA_REAL_OPENCODE_BIN=$($bin.FullName)" >> $env:GITHUB_ENV
          "CODEA_REAL_PLUGIN_BUNDLE=$((Resolve-Path 'distribution/plugins/dist/index.js').Path)" >> $env:GITHUB_ENV
          & $bin.FullName --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run real offline plugin gate
        working-directory: tui
        shell: pwsh
        run: |
          go test ./cmd/codea -run 'TestPrepareOfflinePluginDependencies|TestRealOpenCodePluginAgentLoadDoesNotTouchNpmRegistry' -count=1 -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  linux-full-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum
      - name: Full Go regression
        working-directory: tui
        shell: bash
        run: |
          set -euo pipefail
          go test ./... -count=1
          go vet ./...
          go build ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...
