name: V1 Release Certification

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Exact source commit to certify (blank = workflow SHA)'
        required: false
        default: ''
      g15_gate_b64:
        description: 'Base64 of G15.json produced by run-g15-intranet-gate.ps1; blank intentionally blocks final certification'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: v1-release-certification-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}

jobs:
  release-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tui/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install plugin dependencies
        working-directory: distribution/plugins
        run: bun install --frozen-lockfile
      - name: Packaging contract
        shell: bash
        run: bash tests/offline/task17_packaging_test.sh
      - name: Build all V1 release packages
        shell: bash
        run: ./scripts/run-task17-build-gates.sh "$RUNNER_TEMP/releases" "$RUNNER_TEMP/task17-build-evidence.json"
      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: v1-release-packages-${{ env.SOURCE_COMMIT }}
          path: |
            ${{ runner.temp }}/releases/*.tar.gz
            ${{ runner.temp }}/releases/*.tar.gz.sha256
            ${{ runner.temp }}/releases/*.zip
            ${{ runner.temp }}/releases/*.zip.sha256
            ${{ runner.temp }}/task17-build-evidence.json

  core-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tui/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install plugin dependencies
        working-directory: distribution/plugins
        run: bun install --frozen-lockfile
      - name: Build plugin bundle
        working-directory: distribution/plugins
        run: bun run build
      - name: Release evidence tool regression
        run: python3 tests/release/test_release_gate_tools.py
      - name: Full Go verification
        working-directory: tui
        run: |
          GOTOOLCHAIN=local go test ./... -count=1
          GOTOOLCHAIN=local go test -race ./... -count=1
          GOTOOLCHAIN=local go vet ./...
          GOTOOLCHAIN=local go build ./...
      - name: Full plugin regression
        working-directory: distribution/plugins
        run: bun test
      - name: Download locked OpenCode v1.18.11 linux-x64
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/runtime-meta"
          import json, pathlib
          p=json.loads(pathlib.Path('runtime/version.json').read_text())
          x=p['platforms']['linux-x64']
          print(x['url'])
          print(x['checksum'].removeprefix('sha256:'))
          PY
          url=$(sed -n '1p' "$RUNNER_TEMP/runtime-meta")
          expected=$(sed -n '2p' "$RUNNER_TEMP/runtime-meta")
          curl -fL "$url" -o "$RUNNER_TEMP/opencode.tar.gz"
          actual=$(sha256sum "$RUNNER_TEMP/opencode.tar.gz" | awk '{print $1}')
          test "$actual" = "$expected"
          mkdir -p "$RUNNER_TEMP/opencode"
          tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP/opencode"
          find "$RUNNER_TEMP/opencode" -type f -name opencode -exec chmod +x {} \;
          find "$RUNNER_TEMP/opencode" -type f -name opencode -print -quit > "$RUNNER_TEMP/opencode-path"
          test -s "$RUNNER_TEMP/opencode-path"
      - name: Execute G3 through G14
        shell: bash
        run: |
          CODEA_SOURCE_COMMIT="$SOURCE_COMMIT" \
          OPENCODE_BIN="$(cat "$RUNNER_TEMP/opencode-path")" \
          bash scripts/run-release-parity-gates.sh
      - name: Upload core gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: v1-core-gates-${{ env.SOURCE_COMMIT }}
          path: |
            tests/evidence/release-gates.d/*.json
            tui/tests/parity/evidence/release-parity.json
            tui/tests/parity/evidence/runtime-evidence.json
            tui/tests/parity/evidence/agent-evidence.json
            tui/tests/parity/evidence/api-doc-agent-evidence.json

  native-macos-offline:
    needs: release-build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/download-artifact@v4
        with:
          name: v1-release-packages-${{ env.SOURCE_COMMIT }}
          path: ${{ runner.temp }}/releases
      - name: Extract matching macOS package
        shell: bash
        run: |
          set -euo pipefail
          arch=$(uname -m)
          case "$arch" in arm64) platform=darwin-arm64 ;; x86_64) platform=darwin-x64 ;; *) exit 2 ;; esac
          archive=$(find "$RUNNER_TEMP/releases" -type f -name "codea-*-$platform.tar.gz" -print -quit)
          test -n "$archive"
          mkdir -p "$RUNNER_TEMP/extracted"
          tar -xzf "$archive" -C "$RUNNER_TEMP/extracted"
          find "$RUNNER_TEMP/extracted" -maxdepth 1 -type d -name "codea-*-$platform" -print -quit > "$RUNNER_TEMP/package-dir"
          test -s "$RUNNER_TEMP/package-dir"
      - name: Native macOS completely-offline smoke
        shell: bash
        run: |
          set -euo pipefail
          iface=$(route -n get default | awk '/interface:/{print $2; exit}')
          test -n "$iface"
          started=$(python3 -c 'import time; print(int(time.time()*1000))')
          restore() { sudo ifconfig "$iface" up >/dev/null 2>&1 || true; }
          trap restore EXIT INT TERM
          sudo ifconfig "$iface" down
          sleep 1
          set +e
          bash tests/offline/macos_release_smoke.sh "$(cat "$RUNNER_TEMP/package-dir")" "$RUNNER_TEMP/macos-offline-evidence.json"
          status=$?
          set -e
          restore
          trap - EXIT INT TERM
          finished=$(python3 -c 'import time; print(int(time.time()*1000))')
          echo $((finished-started)) > "$RUNNER_TEMP/macos-duration-ms"
          exit "$status"
      - name: Upload native macOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-native-macos-${{ env.SOURCE_COMMIT }}
          path: |
            ${{ runner.temp }}/macos-offline-evidence.json
            ${{ runner.temp }}/macos-duration-ms

  native-windows-offline:
    needs: release-build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/download-artifact@v4
        with:
          name: v1-release-packages-${{ env.SOURCE_COMMIT }}
          path: ${{ runner.temp }}\releases
      - name: Extract Windows package
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path "$env:RUNNER_TEMP\releases" -Recurse -Filter 'codea-*-windows-x64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'windows-x64 package missing' }
          $dest = Join-Path $env:RUNNER_TEMP 'extracted'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $dest -Force
          $pkg = Get-ChildItem -Path $dest -Directory -Filter 'codea-*-windows-x64' | Select-Object -First 1
          if (-not $pkg) { throw 'extracted windows package missing' }
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'package-dir.txt') -Value $pkg.FullName -NoNewline
      - name: Native Windows completely-offline smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $adapters = @(Get-NetAdapter | Where-Object { $_.Status -eq 'Up' -and $_.HardwareInterface })
          if ($adapters.Count -eq 0) { throw 'no active hardware network adapter found' }
          $started = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          try {
            $adapters | Disable-NetAdapter -Confirm:$false
            Start-Sleep -Seconds 1
            $pkg = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'package-dir.txt') -Raw
            & .\tests\offline\windows_release_smoke.ps1 -PackageDir $pkg -EvidenceFile (Join-Path $env:RUNNER_TEMP 'windows-offline-evidence.json')
            if ($LASTEXITCODE -ne 0) { throw "windows offline smoke failed: $LASTEXITCODE" }
          } finally {
            $adapters | Enable-NetAdapter -Confirm:$false -ErrorAction SilentlyContinue
          }
          $duration = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() - $started
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'windows-duration-ms') -Value $duration -NoNewline
      - name: Upload native Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-native-windows-${{ env.SOURCE_COMMIT }}
          path: |
            ${{ runner.temp }}\windows-offline-evidence.json
            ${{ runner.temp }}\windows-duration-ms

  native-gates:
    needs: [native-macos-offline, native-windows-offline]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/download-artifact@v4
        with:
          name: v1-native-macos-${{ env.SOURCE_COMMIT }}
          path: ${{ runner.temp }}/mac
      - uses: actions/download-artifact@v4
        with:
          name: v1-native-windows-${{ env.SOURCE_COMMIT }}
          path: ${{ runner.temp }}/win
      - name: Derive G1 G2 G2.1
        shell: bash
        run: |
          python3 scripts/derive-native-release-gates.py \
            --source-commit "$SOURCE_COMMIT" \
            --mac-evidence "$RUNNER_TEMP/mac/macos-offline-evidence.json" \
            --mac-duration-ms "$(cat "$RUNNER_TEMP/mac/macos-duration-ms")" \
            --windows-evidence "$RUNNER_TEMP/win/windows-offline-evidence.json" \
            --windows-duration-ms "$(cat "$RUNNER_TEMP/win/windows-duration-ms")" \
            --out-dir "$RUNNER_TEMP/native-gates"
      - uses: actions/upload-artifact@v4
        with:
          name: v1-native-gates-${{ env.SOURCE_COMMIT }}
          path: ${{ runner.temp }}/native-gates/*.json

  certify:
    if: always()
    needs: [core-gates, native-gates]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tui/go.sum
      - name: Download core gates
        if: needs.core-gates.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: v1-core-gates-${{ env.SOURCE_COMMIT }}
          path: ${{ runner.temp }}/core
      - name: Download native gates
        if: needs.native-gates.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: v1-native-gates-${{ env.SOURCE_COMMIT }}
          path: ${{ runner.temp }}/native
      - name: Assemble gate directory and G15
        shell: bash
        env:
          G15_GATE_B64: ${{ inputs.g15_gate_b64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/all-gates" tests/evidence
          if [ "${{ needs.core-gates.result }}" != success ] || [ "${{ needs.native-gates.result }}" != success ]; then
            echo "core/native prerequisite jobs did not pass" >&2
            exit 1
          fi
          find "$RUNNER_TEMP/core" -type f -path '*/release-gates.d/*.json' -exec cp {} "$RUNNER_TEMP/all-gates/" \;
          find "$RUNNER_TEMP/native" -type f -name '*.json' -exec cp {} "$RUNNER_TEMP/all-gates/" \;
          if [ -n "$G15_GATE_B64" ]; then
            printf '%s' "$G15_GATE_B64" | base64 --decode > "$RUNNER_TEMP/all-gates/G15.json"
          else
            python3 scripts/write-release-gate.py --id G15 --source-commit "$SOURCE_COMMIT" --status fail \
              --evidence 'G15 requires real approved-company-intranet mirror evidence from run-g15-intranet-gate.ps1' \
              --out "$RUNNER_TEMP/all-gates/G15.json"
          fi
          python3 scripts/merge-release-gates.py --source-commit "$SOURCE_COMMIT" \
            --input-dir "$RUNNER_TEMP/all-gates" --out tests/evidence/release-gates.json
          parity=$(find "$RUNNER_TEMP/core" -type f -name release-parity.json -print -quit)
          test -n "$parity"
          cp "$parity" tests/evidence/release-parity.json
      - name: Final strict certification
        working-directory: tui
        env:
          CODEA_SOURCE_COMMIT: ${{ env.SOURCE_COMMIT }}
          CODEA_PARITY_EVIDENCE: ../tests/evidence/release-parity.json
          CODEA_RELEASE_GATES: ../tests/evidence/release-gates.json
          CODEA_CERTIFICATION_EVIDENCE: ../tests/evidence/release-certification.json
        run: GOTOOLCHAIN=local go run ./cmd/release-certifier
      - name: Upload final certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-release-certification-${{ env.SOURCE_COMMIT }}
          path: |
            tests/evidence/release-gates.json
            tests/evidence/release-parity.json
            tests/evidence/release-certification.json
          if-no-files-found: warn
