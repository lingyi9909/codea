name: Task 29 Root Epoch Proof

on:
  push:
    branches: [task29-root-epoch-proof]

permissions:
  contents: read

jobs:
  plugin-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        working-directory: distribution/plugins
        run: bun install --frozen-lockfile
      - name: Root epoch and isolation regressions
        working-directory: distribution/plugins
        run: |
          bun test tests/task-root-epoch.test.ts tests/task-planning-isolation.test.ts tests/task-state-store.test.ts tests/task-planning-tools.test.ts tests/task29-acceptance.test.ts tests/task-plan-gate.test.ts
      - name: Full plugin regression and build
        working-directory: distribution/plugins
        run: |
          bun test
          bun run build

  app-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tui/go.sum
      - name: Root identity focused regression
        working-directory: tui
        run: GOTOOLCHAIN=local go test ./internal/opencode ./internal/app -run 'Task29MessageUpdated|TaskExecution|TaskPlan|ToolMetadata|Trace|Session' -count=1
      - name: Full Go regression
        working-directory: tui
        run: GOTOOLCHAIN=local go test ./... -count=1
