name: Task 29 Plan Gate TDD

on:
  push:
    branches:
      - task29-gate-tdd

jobs:
  task29-plan-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install plugin dependencies
        working-directory: distribution/plugins
        run: bun install --frozen-lockfile
      - name: Task 29 plan gate RED/GREEN
        working-directory: distribution/plugins
        run: bun test tests/task-plan-gate.test.ts
