name: Windows Runtime No-Model Diagnostic

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/windows-runtime-no-model-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-model-agent-discovery:
    runs-on: windows-2025
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tui/go.sum

      - name: Download locked OpenCode v1.18.11 windows-x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'codea-no-model-runtime'
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $zip = Join-Path $root 'opencode-windows-x64.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/anomalyco/opencode/releases/download/v1.18.11/opencode-windows-x64.zip' -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($hash -ne 'f3a5ea814aecc692a4e04259d9005283f364225b38456c90f9a47b7a9d83c0e9') {
            throw "OpenCode archive checksum mismatch: $hash"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $root 'extract') -Force
          $oc = Get-ChildItem -LiteralPath (Join-Path $root 'extract') -Recurse -Filter 'opencode.exe' -File | Select-Object -First 1
          if (-not $oc) { throw 'opencode.exe not found' }
          "REAL_OC=$($oc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $oc.FullName --version

      - name: Prepare plugin-only config with no model or provider
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = Join-Path $env:RUNNER_TEMP 'codea-no-model-config'
          Remove-Item -Recurse -Force $cfg -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $cfg | Out-Null

          $pluginPath = (Resolve-Path (Join-Path $env:GITHUB_WORKSPACE 'distribution/plugins/dist/index.js')).Path
          $pluginUri = ([System.Uri]$pluginPath).AbsoluteUri
          if (-not $pluginUri.StartsWith('file:///')) { throw "invalid Windows plugin URI: $pluginUri" }

          $config = [ordered]@{
            '$schema' = 'https://opencode.ai/config.json'
            plugin = @($pluginUri)
          }
          $config | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $cfg 'opencode.json') -Encoding utf8
          Get-Content -LiteralPath (Join-Path $cfg 'opencode.json') -Raw
          "REAL_CFG=$cfg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Supervisor and agent discovery with no model configured
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probeDir = Join-Path $env:GITHUB_WORKSPACE 'tui/cmd/nomodelprobe'
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          @'
          package main

          import (
            "context"
            "fmt"
            "os"
            "time"

            "codea/tui/internal/opencode"
            "codea/tui/internal/supervisor"
          )

          func main() {
            projectRoot := os.Getenv("GITHUB_WORKSPACE")
            s := supervisor.NewSupervisor(supervisor.Config{
              OpenCodeBin: os.Getenv("REAL_OC"),
              ConfigDir: os.Getenv("REAL_CFG"),
              ProjectRoot: projectRoot,
              StartupTimeout: 30 * time.Second,
              StopTimeout: 5 * time.Second,
            })
            ctx, cancel := context.WithTimeout(context.Background(), 35*time.Second)
            defer cancel()
            if err := s.Start(ctx); err != nil {
              fmt.Printf("NO_MODEL_SUPERVISOR FAIL status=%s err=%v last=%v\n", s.Status(), err, s.LastError())
              os.Exit(1)
            }
            defer s.Stop()
            fmt.Printf("NO_MODEL_SUPERVISOR PASS status=%s url=%s\n", s.Status(), s.BaseURL())

            adapter := opencode.NewOpenCodeAdapterForDirectory(s.BaseURL(), s.Username(), s.Password(), projectRoot)
            agentCtx, agentCancel := context.WithTimeout(context.Background(), 30*time.Second)
            defer agentCancel()
            started := time.Now()
            agents, err := adapter.ListAgents(agentCtx)
            elapsed := time.Since(started)
            if err != nil {
              fmt.Printf("NO_MODEL_LIST_AGENTS FAIL elapsed=%s err=%v\n", elapsed, err)
              os.Exit(1)
            }
            fmt.Printf("NO_MODEL_LIST_AGENTS PASS elapsed=%s count=%d\n", elapsed, len(agents))
          }
          '@ | Set-Content -LiteralPath (Join-Path $probeDir 'main.go') -Encoding utf8

          $env:OPENCODE_DISABLE_CLAUDE_CODE = '1'
          $env:OPENCODE_DISABLE_MODELS_FETCH = '1'
          $env:OPENCODE_DISABLE_AUTOUPDATE = '1'
          $env:OPENCODE_DISABLE_EMBEDDED_WEB_UI = '1'
          $env:OPENCODE_DISABLE_LSP_DOWNLOAD = '1'
          $env:OPENCODE_DISABLE_DEFAULT_PLUGINS = '1'
          $env:OPENCODE_DISABLE_EXTERNAL_SKILLS = '1'

          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'tui')
          try {
            go run ./cmd/nomodelprobe
          } finally {
            Pop-Location
          }
