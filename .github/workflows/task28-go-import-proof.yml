name: Task 28 Go Import Proof

on:
  push:
    branches: [task28-go-import-proof]

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tui/go.sum
      - name: External module collision regression
        working-directory: tui
        run: GOTOOLCHAIN=local go test ./internal/repoctx -run '^TestTask28RemediationExternalGoImportNotPromoted$' -count=1
      - name: All Task 28 remediation regressions
        working-directory: tui
        run: GOTOOLCHAIN=local go test ./internal/repoctx -run '^TestTask28Remediation' -count=1
      - name: Repoctx package regression
        working-directory: tui
        run: GOTOOLCHAIN=local go test ./internal/repoctx -count=1
