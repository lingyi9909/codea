name: Task 18-19 Acceptance Gates

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/task18-19-gates.yml'
      - 'tui/internal/update/**'
      - 'tui/internal/doctor/**'
      - 'tui/internal/supervisor/**'
      - 'tui/internal/runtime/**'
      - 'tui/internal/opencode/**'
      - 'tui/cmd/codea/**'
      - 'tui/tests/e2e/update-doctor/**'
      - 'tests/upgrade/**'
      - 'scripts/run-real-candidate-doctor-smoke.sh'
      - 'packaging/platform/**'
      - 'tests/offline/task17_packaging_test.sh'
      - 'tests/offline/task18_launcher_contract_test.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  task18-19-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tui/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install validator dependency
        run: python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Install plugin dependencies
        working-directory: distribution/plugins
        run: bun install --frozen-lockfile

      - name: Build plugin bundle and run plugin regression
        working-directory: distribution/plugins
        run: |
          bun test
          bun run build

      - name: Go full regression
        working-directory: tui
        run: |
          GOTOOLCHAIN=local go test ./... -count=1
          GOTOOLCHAIN=local go test -race ./... -count=1
          GOTOOLCHAIN=local go vet ./...
          GOTOOLCHAIN=local go build ./...

      - name: Cross-build macOS arm64 and Windows x64
        working-directory: tui
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 GOTOOLCHAIN=local go build ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 GOTOOLCHAIN=local go build ./...

      - name: Task 18 upgrade scenarios
        shell: bash
        run: |
          bash tests/upgrade/fresh_install_test.sh
          bash tests/upgrade/upgrade_test.sh
          bash tests/upgrade/failed_upgrade_test.sh
          bash tests/upgrade/rollback_test.sh

      - name: Launcher and packaging regression
        shell: bash
        run: |
          bash tests/offline/task18_launcher_contract_test.sh
          bash tests/offline/task17_packaging_test.sh

      - name: Execution-state validator
        shell: bash
        run: bash scripts/check-execution-state.sh

      - name: Download locked OpenCode v1.18.11 linux-x64
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/runtime-meta"
          import json, pathlib
          p=json.loads(pathlib.Path('runtime/version.json').read_text())
          x=p['platforms']['linux-x64']
          print(x['url'])
          print(x['checksum'].removeprefix('sha256:'))
          PY
          url=$(sed -n '1p' "$RUNNER_TEMP/runtime-meta")
          expected=$(sed -n '2p' "$RUNNER_TEMP/runtime-meta")
          curl -fL "$url" -o "$RUNNER_TEMP/opencode.tar.gz"
          actual=$(sha256sum "$RUNNER_TEMP/opencode.tar.gz" | awk '{print $1}')
          test "$actual" = "$expected"
          mkdir -p "$RUNNER_TEMP/opencode"
          tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP/opencode"
          find "$RUNNER_TEMP/opencode" -type f -name opencode -exec chmod +x {} \;
          find "$RUNNER_TEMP/opencode" -type f -name opencode -print -quit > "$RUNNER_TEMP/opencode-path"
          test -s "$RUNNER_TEMP/opencode-path"

      - name: Existing Task 14-16 real runtime regression
        shell: bash
        run: |
          OPENCODE_BIN="$(cat "$RUNNER_TEMP/opencode-path")" bash scripts/run-real-agent-smoke.sh
          OPENCODE_BIN="$(cat "$RUNNER_TEMP/opencode-path")" bash scripts/run-real-api-doc-smoke.sh

      - name: Real candidate Doctor with OpenCode v1.18.11
        shell: bash
        run: |
          OPENCODE_BIN="$(cat "$RUNNER_TEMP/opencode-path")" \
          CODEA_CANDIDATE_EVIDENCE="$RUNNER_TEMP/candidate-doctor-evidence.json" \
          bash scripts/run-real-candidate-doctor-smoke.sh

      - name: Write gate summary evidence
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/candidate-doctor-evidence.json" "$RUNNER_TEMP/task18-19-gate-evidence.json" "$GITHUB_SHA" <<'PY'
          import json, pathlib, sys, datetime
          candidate=json.loads(pathlib.Path(sys.argv[1]).read_text())
          out={
            "timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "sourceCommit": sys.argv[3],
            "goFullRegression": True,
            "goRace": True,
            "goVet": True,
            "goBuild": True,
            "darwinArm64CrossBuild": True,
            "windowsX64CrossBuild": True,
            "upgradeScenarios": "4/4",
            "bunRegression": True,
            "launcherContract": True,
            "task17PackagingRegression": True,
            "executionStateValidator": True,
            "existingAgentRuntimeRegression": True,
            "apiDocumentationRuntimeRegression": True,
            "candidateDoctor": candidate,
            "passed": True,
          }
          pathlib.Path(sys.argv[2]).write_text(json.dumps(out, indent=2)+"\n")
          PY

      - name: Upload Task 18-19 evidence
        uses: actions/upload-artifact@v4
        with:
          name: task18-19-evidence
          path: |
            ${{ runner.temp }}/candidate-doctor-evidence.json
            ${{ runner.temp }}/task18-19-gate-evidence.json

      - name: Persist fresh evidence to develop
        shell: bash
        run: |
          mkdir -p tests/evidence
          cp "$RUNNER_TEMP/candidate-doctor-evidence.json" tests/evidence/candidate-doctor-evidence.json
          cp "$RUNNER_TEMP/task18-19-gate-evidence.json" tests/evidence/task18-19-gate-evidence.json
          git config user.name "codea-gates"
          git config user.email "codea-gates@users.noreply.github.com"
          git add tests/evidence/candidate-doctor-evidence.json tests/evidence/task18-19-gate-evidence.json
          git commit -m "chore: record Task 18-19 gate evidence [skip ci]"
          git push origin HEAD:develop
