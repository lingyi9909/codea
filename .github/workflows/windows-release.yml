name: Windows Release Package

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/windows-release.yml'
      - 'tui/**'
      - 'distribution/plugins/**'
      - 'distribution/agents/**'
      - 'distribution/skills/**'
      - 'distribution/config/**'
      - 'runtime/**'
      - 'packaging/**'
      - 'VERSION'
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: preview
        type: choice
        options:
          - preview
          - stable

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer-smoke:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tui/go.sum

      - name: Gate offline Codea plugin startup with real OpenCode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $meta = Get-Content -LiteralPath runtime/version.json -Raw | ConvertFrom-Json
          if ($meta.openCodeVersion -ne '1.18.11') { throw "unexpected OpenCode version: $($meta.openCodeVersion)" }
          $p = $meta.platforms.'windows-x64'
          $archive = Join-Path $env:RUNNER_TEMP $p.asset
          Invoke-WebRequest -Uri $p.url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $expected = ([string]$p.checksum) -replace '^sha256:', ''
          if ($actual -ne $expected) { throw "OpenCode checksum mismatch: $actual != $expected" }
          $extract = Join-Path $env:RUNNER_TEMP 'opencode-offline-gate'
          Remove-Item -Recurse -Force $extract -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $bin = Get-ChildItem -LiteralPath $extract -Recurse -Filter opencode.exe -File | Select-Object -First 1
          if (-not $bin) { throw 'opencode.exe not found' }
          $env:CODEA_REAL_OPENCODE_BIN = $bin.FullName
          $env:CODEA_REAL_PLUGIN_BUNDLE = (Resolve-Path 'distribution/plugins/dist/index.js').Path
          Push-Location tui
          try {
            go test ./cmd/codea -run 'TestPrepareOfflinePluginDependencies|TestRealOpenCodePluginAgentLoadDoesNotTouchNpmRegistry' -count=1 -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Gate Runtime MOTW self-heal
        working-directory: tui
        shell: pwsh
        run: go test ./internal/supervisor -run TestConfigureProcessRemovesRuntimeZoneIdentifier -count=1

      - name: Execute install.ps1 on a real Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Join-Path $env:RUNNER_TEMP 'codea-installer-smoke-package'
          $smokeHome = Join-Path $env:RUNNER_TEMP 'codea-installer-smoke-home'
          Remove-Item -Recurse -Force $pkg,$smokeHome -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $pkg,(Join-Path $pkg 'bin'),(Join-Path $pkg 'plugins') | Out-Null

          Set-Content -LiteralPath (Join-Path $pkg 'VERSION') -Value '0.1.0-smoke' -NoNewline
          Set-Content -LiteralPath (Join-Path $pkg 'bin/codea.exe') -Value 'smoke-codea' -NoNewline
          Set-Content -LiteralPath (Join-Path $pkg 'bin/opencode.exe') -Value 'smoke-opencode' -NoNewline
          Copy-Item -LiteralPath './distribution/plugins/dist/index.js' -Destination (Join-Path $pkg 'plugins/index.js')

          # Simulate a browser-downloaded archive whose executable carries MOTW.
          Set-Content -LiteralPath (Join-Path $pkg 'bin/opencode.exe') -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" -NoNewline

          $entries = Get-ChildItem -LiteralPath $pkg -Recurse -File | ForEach-Object {
            $rel = [IO.Path]::GetRelativePath($pkg, $_.FullName) -replace '\\','/'
            [pscustomobject]@{
              path = $rel
              size = $_.Length
              sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            }
          }
          [pscustomobject]@{
            schemaVersion = 1
            algorithm = 'sha256'
            files = @($entries)
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $pkg 'manifest.json') -Encoding UTF8

          $env:CODEA_HOME = $smokeHome
          & ./packaging/platform/windows/install.ps1 -PackageDir $pkg

          $installed = Join-Path $smokeHome 'versions/0.1.0-smoke'
          $installedOpenCode = Join-Path $installed 'bin/opencode.exe'
          if (-not (Test-Path (Join-Path $installed 'bin/codea.exe') -PathType Leaf)) { throw 'installed codea.exe missing' }
          if (-not (Test-Path $installedOpenCode -PathType Leaf)) { throw 'installed opencode.exe missing' }
          if (-not (Test-Path (Join-Path $smokeHome 'bin/codea.cmd') -PathType Leaf)) { throw 'codea.cmd shim missing' }
          if (-not (Test-Path (Join-Path $smokeHome 'current.txt') -PathType Leaf)) { throw 'current.txt missing' }
          if (-not (Test-Path (Join-Path $smokeHome 'current') -PathType Container)) { throw 'current junction missing' }
          if (Get-Item -LiteralPath $installedOpenCode -Stream Zone.Identifier -ErrorAction SilentlyContinue) {
            throw 'installed opencode.exe still carries Zone.Identifier/MOTW'
          }
          Write-Host 'Windows installer smoke passed.'

  build-and-publish:
    needs: windows-installer-smoke
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tui/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Gate Windows plugin file URL encoding
        working-directory: tui
        run: GOTOOLCHAIN=local go test ./internal/opencode -run 'TestPluginFileURLWindowsDrive' -count=1

      - name: Install plugin dependencies
        working-directory: distribution/plugins
        run: bun install --frozen-lockfile

      - name: Build Windows x64 release package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-release
          mkdir -p dist-release
          bash packaging/scripts/build-release.sh windows-x64 dist-release

      - name: Verify Windows release archive
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          archive="dist-release/codea-${version}-windows-x64.zip"
          checksum="${archive}.sha256"
          test -s "$archive"
          test -s "$checksum"
          (cd dist-release && sha256sum -c "codea-${version}-windows-x64.zip.sha256")
          python3 - "$archive" "$version" <<'PY'
          import sys, zipfile
          archive, version = sys.argv[1:]
          prefix = f"codea-{version}-windows-x64"
          required = {
              f"{prefix}/bin/codea.exe",
              f"{prefix}/bin/opencode.exe",
              f"{prefix}/install/install.ps1",
              f"{prefix}/manifest.json",
              f"{prefix}/VERSION",
          }
          with zipfile.ZipFile(archive) as z:
              names = set(z.namelist())
          missing = sorted(required - names)
          if missing:
              print("missing required release entries:", file=sys.stderr)
              for name in missing:
                  print(f"  - {name}", file=sys.stderr)
              print("archive entries:", file=sys.stderr)
              for name in sorted(names):
                  print(f"  {name}", file=sys.stderr)
              raise SystemExit(1)
          print(f"archive content verified: {len(names)} files")
          PY
          echo "Windows release archive verified: $archive"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: codea-windows-x64-${{ github.sha }}
          path: |
            dist-release/codea-*-windows-x64.zip
            dist-release/codea-*-windows-x64.zip.sha256
          if-no-files-found: error

      - name: Resolve release channel
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          channel="preview"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            channel="${{ inputs.channel }}"
          fi
          if [[ "$channel" == "stable" ]]; then
            tag="v${version}"
            title="Codea v${version}"
            prerelease=false
          else
            tag="v${version}-preview"
            title="Codea v${version} Preview"
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          archive="dist-release/codea-${RELEASE_VERSION}-windows-x64.zip"
          checksum="${archive}.sha256"
          notes="$RUNNER_TEMP/release-notes.md"
          {
            printf 'Windows x64 downloadable package for Codea %s.\n\n' "$RELEASE_VERSION"
            printf 'Package contents include Codea, locked OpenCode runtime, plugins, agents, skills, configuration, checksum manifest, and Windows installer.\n\n'
            printf 'Download `codea-%s-windows-x64.zip`, extract it, then run `install/install.ps1` from PowerShell.\n\n' "$RELEASE_VERSION"
            printf 'This preview package is for product trial before final company-intranet G15 release certification. A stable `v%s` release should only be published after final certification passes.\n' "$RELEASE_VERSION"
          } > "$notes"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$archive" "$checksum" --clobber
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file "$notes"
          else
            args=(release create "$RELEASE_TAG" "$archive" "$checksum" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file "$notes")
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}"
          fi

      - name: Print download target
        shell: bash
        run: |
          echo "Release tag: ${{ steps.release.outputs.tag }}"
          echo "Asset: codea-${{ steps.release.outputs.version }}-windows-x64.zip"
