name: Windows Release Package

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/windows-release.yml'
      - 'tui/**'
      - 'distribution/plugins/**'
      - 'distribution/agents/**'
      - 'distribution/skills/**'
      - 'distribution/config/**'
      - 'runtime/**'
      - 'packaging/**'
      - 'VERSION'
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: preview
        type: choice
        options:
          - preview
          - stable

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows_installer_smoke:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tui/go.sum

      - name: Gate Windows runtime execution boundary
        working-directory: tui
        shell: pwsh
        run: go test ./internal/supervisor -run 'TestConfigureProcessRemovesRuntimeZoneIdentifier|TestStartRuntimeCommandRetriesTransientAccessDenied|TestStartRuntimeCommandDoesNotRetryOtherErrors|TestStopTerminatesProcessTree|TestStopForceKillFallback' -count=1

      - name: Download locked OpenCode v1.18.11 Windows runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $meta = Get-Content -LiteralPath runtime/version.json -Raw | ConvertFrom-Json
          if ($meta.openCodeVersion -ne '1.18.11') { throw "unexpected OpenCode version: $($meta.openCodeVersion)" }
          $p = $meta.platforms.'windows-x64'
          $archive = Join-Path $env:RUNNER_TEMP $p.asset
          Invoke-WebRequest -Uri $p.url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $expected = ([string]$p.checksum) -replace '^sha256:', ''
          if ($actual -ne $expected) { throw "OpenCode checksum mismatch: $actual != $expected" }
          $extract = Join-Path $env:RUNNER_TEMP 'opencode-1.18.11'
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $bin = Get-ChildItem -LiteralPath $extract -Recurse -Filter opencode.exe -File | Select-Object -First 1
          if (-not $bin) { throw 'opencode.exe not found' }
          "CODEA_REAL_OPENCODE_BIN=$($bin.FullName)" >> $env:GITHUB_ENV
          "CODEA_REAL_PLUGIN_BUNDLE=$((Resolve-Path 'distribution/plugins/dist/index.js').Path)" >> $env:GITHUB_ENV
          & $bin.FullName --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Gate real OpenCode plugin startup without npm registry
        working-directory: tui
        shell: pwsh
        run: |
          go test ./cmd/codea -run 'TestPrepareOfflinePluginDependencies|TestRealOpenCodePluginAgentLoadDoesNotTouchNpmRegistry' -count=1 -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Execute install.ps1 on a real Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Join-Path $env:RUNNER_TEMP 'codea-installer-smoke-package'
          $smokeHome = Join-Path $env:RUNNER_TEMP 'codea-installer-smoke-home'
          Remove-Item -Recurse -Force $pkg,$smokeHome -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $pkg,(Join-Path $pkg 'bin'),(Join-Path $pkg 'plugins') | Out-Null
          Set-Content -LiteralPath (Join-Path $pkg 'VERSION') -Value '0.1.0-smoke' -NoNewline
          Set-Content -LiteralPath (Join-Path $pkg 'bin/codea.exe') -Value 'smoke-codea' -NoNewline
          Set-Content -LiteralPath (Join-Path $pkg 'bin/opencode.exe') -Value 'smoke-opencode' -NoNewline
          Copy-Item -LiteralPath './distribution/plugins/dist/index.js' -Destination (Join-Path $pkg 'plugins/index.js')
          Set-Content -LiteralPath (Join-Path $pkg 'bin/opencode.exe') -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" -NoNewline
          $entries = Get-ChildItem -LiteralPath $pkg -Recurse -File | ForEach-Object {
            $rel = [IO.Path]::GetRelativePath($pkg, $_.FullName) -replace '\\','/'
            [pscustomobject]@{ path=$rel; size=$_.Length; sha256=(Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant() }
          }
          [pscustomobject]@{ schemaVersion=1; algorithm='sha256'; files=@($entries) } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $pkg 'manifest.json') -Encoding UTF8
          $env:CODEA_HOME = $smokeHome
          & ./packaging/platform/windows/install.ps1 -PackageDir $pkg
          $installedOpenCode = Join-Path $smokeHome 'versions/0.1.0-smoke/bin/opencode.exe'
          if (-not (Test-Path -LiteralPath $installedOpenCode -PathType Leaf)) { throw 'installed opencode.exe missing' }
          if (Get-Item -LiteralPath $installedOpenCode -Stream Zone.Identifier -ErrorAction SilentlyContinue) { throw 'installed opencode.exe still carries Zone.Identifier/MOTW' }
          Write-Host 'Windows installer smoke passed.'

  build_package:
    needs: windows_installer_smoke
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tui/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Gate Windows plugin file URL encoding
        working-directory: tui
        run: GOTOOLCHAIN=local go test ./internal/opencode -run 'TestPluginFileURLWindowsDrive' -count=1
      - name: Install plugin dependencies
        working-directory: distribution/plugins
        run: bun install --frozen-lockfile
      - name: Build unsigned Windows x64 release package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-release
          mkdir -p dist-release
          bash packaging/scripts/build-release.sh windows-x64 dist-release
          version=$(tr -d '[:space:]' < VERSION)
          (cd dist-release && sha256sum -c "codea-${version}-windows-x64.zip.sha256")
      - name: Upload unsigned package for Windows finalization
        uses: actions/upload-artifact@v4
        with:
          name: codea-windows-unsigned-${{ github.sha }}
          path: |
            dist-release/codea-*-windows-x64.zip
            dist-release/codea-*-windows-x64.zip.sha256
          if-no-files-found: error

  finalize_and_publish:
    needs: build_package
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: codea-windows-unsigned-${{ github.sha }}
          path: dist-release

      - name: Resolve release identity
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $channel = 'preview'
          $requested = '${{ inputs.channel }}'
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and -not [string]::IsNullOrWhiteSpace($requested)) { $channel = $requested }
          if ($channel -eq 'stable') {
            $tag = "v$version"
            $title = "Codea v$version"
            $prerelease = 'false'
          } else {
            $tag = "v$version-preview"
            $title = "Codea v$version Preview"
            $prerelease = 'true'
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_CHANNEL=$channel" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "RELEASE_TITLE=$title" >> $env:GITHUB_ENV
          "RELEASE_PRERELEASE=$prerelease" >> $env:GITHUB_ENV

      - name: Authenticode finalize archive and build security evidence
        shell: pwsh
        env:
          CODEA_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.CODEA_WINDOWS_SIGNING_PFX_BASE64 }}
          CODEA_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.CODEA_WINDOWS_SIGNING_PFX_PASSWORD }}
          CODEA_WINDOWS_TIMESTAMP_URL: ${{ vars.CODEA_WINDOWS_TIMESTAMP_URL }}
        run: |
          $archive = Join-Path $PWD "dist-release/codea-$env:RELEASE_VERSION-windows-x64.zip"
          $evidence = Join-Path $PWD "dist-release/codea-$env:RELEASE_VERSION-windows-security-evidence.json"
          & ./packaging/platform/windows/finalize-release.ps1 -Archive $archive -Channel $env:RELEASE_CHANNEL -GitCommit '${{ github.sha }}' -ReleaseTag $env:RELEASE_TAG -EvidenceOutput $evidence

      - name: Upload finalized release artifact and security evidence
        uses: actions/upload-artifact@v4
        with:
          name: codea-windows-x64-${{ github.sha }}
          path: |
            dist-release/codea-*-windows-x64.zip
            dist-release/codea-*-windows-x64.zip.sha256
            dist-release/codea-*-windows-security-evidence.json
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "dist-release/codea-$env:RELEASE_VERSION-windows-x64.zip"
          $checksum = "$archive.sha256"
          $evidence = "dist-release/codea-$env:RELEASE_VERSION-windows-security-evidence.json"
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $sig = (Get-Content -LiteralPath $evidence -Raw | ConvertFrom-Json).signatureStatus
          @"
Windows x64 downloadable package for Codea $env:RELEASE_VERSION.

Publisher signature status: $sig. The package also includes deterministic Windows security evidence for 360/EDR false-positive handling.

Download ``codea-$env:RELEASE_VERSION-windows-x64.zip``, extract it, then run ``install/install.ps1`` from PowerShell.

Stable Windows releases fail closed without production Authenticode credentials. Company-intranet G15 certification remains a separate release requirement.
"@ | Set-Content -LiteralPath $notes -Encoding UTF8

          & gh release view $env:RELEASE_TAG *> $null
          $exists = ($LASTEXITCODE -eq 0)
          if ($exists) {
            & gh release upload $env:RELEASE_TAG $archive $checksum $evidence --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & gh release edit $env:RELEASE_TAG --target '${{ github.sha }}' --title $env:RELEASE_TITLE --notes-file $notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $args = @('release','create',$env:RELEASE_TAG,$archive,$checksum,$evidence,'--target','${{ github.sha }}','--title',$env:RELEASE_TITLE,'--notes-file',$notes)
            if ($env:RELEASE_PRERELEASE -eq 'true') { $args += '--prerelease' }
            & gh @args
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Print download target
        shell: pwsh
        run: |
          Write-Host "Release tag: $env:RELEASE_TAG"
          Write-Host "Asset: codea-$env:RELEASE_VERSION-windows-x64.zip"
          Write-Host "Security evidence: codea-$env:RELEASE_VERSION-windows-security-evidence.json"
