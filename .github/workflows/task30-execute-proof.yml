name: Task 30 Execution Proof

on:
  push:
    branches: [task30-tdd-execute]

permissions:
  contents: read

concurrency:
  group: task30-execute-proof
  cancel-in-progress: true

jobs:
  execute-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install plugin dependencies
        working-directory: distribution/plugins
        run: bun install --frozen-lockfile
      - name: Run Task 30 focused plugin proof
        working-directory: distribution/plugins
        run: bun test tests/verify-project-contract.test.ts tests/verify-project-detect.test.ts tests/verify-project-execute.test.ts tests/verify-project-plugin.test.ts
      - name: Run full plugin regression and build
        working-directory: distribution/plugins
        run: |
          bun test
          bun run build
