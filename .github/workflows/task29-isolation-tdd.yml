name: Task 29 Isolation TDD

on:
  push:
    branches:
      - task29-isolation-tdd

jobs:
  task29-isolation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache-dependency-path: tui/go.sum
      - name: Install plugin dependencies
        working-directory: distribution/plugins
        run: bun install --frozen-lockfile
      - name: Task 29 plugin isolation proof
        working-directory: distribution/plugins
        run: bun test tests/task-planning-isolation.test.ts
      - name: Task 29 Application resume isolation RED/GREEN
        working-directory: tui
        run: GOTOOLCHAIN=local go test ./internal/app -run 'TaskExecution|Session|Resume' -count=1
