name: Windows Runtime Diagnostic

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/windows-runtime-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-runtime-startup:
    runs-on: windows-2025
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: tui/go.sum

      - name: Download locked OpenCode v1.18.11 windows-x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'codea-real-runtime'
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $zip = Join-Path $root 'opencode-windows-x64.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/anomalyco/opencode/releases/download/v1.18.11/opencode-windows-x64.zip' -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($hash -ne 'f3a5ea814aecc692a4e04259d9005283f364225b38456c90f9a47b7a9d83c0e9') {
            throw "OpenCode archive checksum mismatch: $hash"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $root 'extract') -Force
          $oc = Get-ChildItem -LiteralPath (Join-Path $root 'extract') -Recurse -Filter 'opencode.exe' -File | Select-Object -First 1
          if (-not $oc) { throw 'opencode.exe not found' }
          "REAL_OC=$($oc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $oc.FullName --version

      - name: Prepare Codea-equivalent runtime environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = Join-Path $env:RUNNER_TEMP 'codea-real-runtime-config'
          Remove-Item -Recurse -Force $cfg -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $cfg | Out-Null
          Set-Content -LiteralPath (Join-Path $cfg 'opencode.json') -Value '{}' -Encoding utf8
          "REAL_CFG=$cfg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Direct OpenCode serve with Codea environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = $env:REAL_CFG
          $env:OPENCODE_CONFIG_DIR = $cfg
          $env:OPENCODE_SERVER_USERNAME = 'opencode'
          $env:OPENCODE_SERVER_PASSWORD = 'diagnostic-password'
          $env:OPENCODE_DISABLE_CLAUDE_CODE = '1'
          $env:OPENCODE_DISABLE_MODELS_FETCH = '1'
          $env:OPENCODE_DISABLE_AUTOUPDATE = '1'
          $env:OPENCODE_DISABLE_EMBEDDED_WEB_UI = '1'
          $env:OPENCODE_DISABLE_LSP_DOWNLOAD = '1'
          $env:OPENCODE_DISABLE_DEFAULT_PLUGINS = '1'
          $env:OPENCODE_DISABLE_EXTERNAL_SKILLS = '1'
          $env:XDG_CONFIG_HOME = Join-Path $cfg 'xdg/config'
          $env:XDG_DATA_HOME = Join-Path $cfg 'xdg/data'
          $env:XDG_CACHE_HOME = Join-Path $cfg 'xdg/cache'
          $env:XDG_STATE_HOME = Join-Path $cfg 'xdg/state'

          $stdout = Join-Path $env:RUNNER_TEMP 'opencode-direct.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'opencode-direct.stderr.log'
          Remove-Item $stdout,$stderr -ErrorAction SilentlyContinue
          $port = 45691
          $p = Start-Process -FilePath $env:REAL_OC -ArgumentList @('serve','--hostname','127.0.0.1','--port',"$port") -WorkingDirectory $env:GITHUB_WORKSPACE -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru -NoNewWindow
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ($p.HasExited) { break }
              try {
                $pair = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes('opencode:diagnostic-password'))
                $r = Invoke-RestMethod -Uri "http://127.0.0.1:$port/global/health" -Headers @{ Authorization = "Basic $pair" } -TimeoutSec 1
                if ($r.healthy -eq $true) { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            Write-Host '=== DIRECT STDOUT ==='
            if (Test-Path $stdout) { Get-Content -LiteralPath $stdout -Raw }
            Write-Host '=== DIRECT STDERR ==='
            if (Test-Path $stderr) { Get-Content -LiteralPath $stderr -Raw }
            if (-not $ready) {
              Write-Host "process exited=$($p.HasExited) exitCode=$(if ($p.HasExited) { $p.ExitCode } else { 'running' })"
              throw 'direct opencode serve did not become healthy within 30s'
            }
            Write-Host 'DIRECT_OPENCODE_SERVE PASS'
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Codea RuntimeSupervisor with same OpenCode binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probeDir = Join-Path $env:GITHUB_WORKSPACE 'tui/cmd/runtimeprobe'
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          @'
          package main

          import (
            "context"
            "fmt"
            "os"
            "time"

            "codea/tui/internal/supervisor"
          )

          func main() {
            s := supervisor.NewSupervisor(supervisor.Config{
              OpenCodeBin: os.Getenv("REAL_OC"),
              ConfigDir: os.Getenv("REAL_CFG"),
              ProjectRoot: os.Getenv("GITHUB_WORKSPACE"),
              StartupTimeout: 30 * time.Second,
              StopTimeout: 5 * time.Second,
            })
            ctx, cancel := context.WithTimeout(context.Background(), 35*time.Second)
            defer cancel()
            if err := s.Start(ctx); err != nil {
              fmt.Printf("SUPERVISOR_START FAIL status=%s err=%v last=%v\n", s.Status(), err, s.LastError())
              os.Exit(1)
            }
            fmt.Printf("SUPERVISOR_START PASS status=%s url=%s\n", s.Status(), s.BaseURL())
            if err := s.Stop(); err != nil {
              fmt.Printf("SUPERVISOR_STOP FAIL err=%v\n", err)
              os.Exit(1)
            }
          }
          '@ | Set-Content -LiteralPath (Join-Path $probeDir 'main.go') -Encoding utf8
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'tui')
          try {
            go run ./cmd/runtimeprobe
          } finally {
            Pop-Location
          }
